name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check trajex/
      - name: Test
        run: pytest tests/ -v --tb=short
      - name: CLI smoke test
        run: |
          trajex scan tests/fixtures/traces/auth_bypass.json || true
          trajex info tests/fixtures/traces/clean_delete.json
